interface:
  display_name: "CSB Analysis"
  short_description: "Correlate CSB performance metric drops with monitors, hot kernel functions, and upstream changes"
  default_prompt: "Use $csb-analysis to analyze CSB results under results/ by finding the execution-unit count where a specific performance metric drops unexpectedly, correlating collected monitor stats with that drop, identifying widening perf/flamegraph kernel functions, and checking whether those hot paths changed upstream compared to the sources of the kernel running at the test machine."
policy:
  allow_implicit_invocation: true
