interface:
  display_name: "CSB Usage"
  short_description: "Configure and run CSB benchmark campaigns"
  default_prompt: "Use $csb to prepare the environment, adapt JSON configs, configure linux-perf-friendly monitors, run CSB benchmarks, replot results, or refresh ordinary benchmark configs. Use $csb-remote alongside it when the benchmark machine is reached over SSH."
policy:
  allow_implicit_invocation: true
